services:
  postgres:
    image: postgres:16-alpine
    container_name: spacetoby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spacetoby}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spacetoby_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spacetoby"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: spacetoby-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/spacetoby?schema=public
      JWT_SECRET: ${JWT_SECRET:-spacetoby-local-dev-only-change-me-32chars}
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "pnpm --filter @spacetoby/api prisma:migrate && pnpm --filter @spacetoby/api start:prod"]

volumes:
  spacetoby_pgdata:
