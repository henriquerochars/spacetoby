name: SpaceToby CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-and-contracts:
    name: NestJS API & Contracts — Lint, Build, Unit & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Shared API Contracts
        run: pnpm --filter @spacetoby/api-contracts build

      - name: Lint Workspace
        run: pnpm lint

      - name: Build Workspace
        run: pnpm build

      - name: Run Unit Tests
        run: pnpm test
        env:
          SKIP_DB_CONNECT: "true"
          NODE_ENV: "test"
          JWT_SECRET: "spacetoby-ci-only-secret-do-not-use-outside-tests"

      - name: Run E2E Workflow Tests
        run: pnpm test:e2e
        env:
          SKIP_DB_CONNECT: "true"
          NODE_ENV: "test"
          JWT_SECRET: "spacetoby-ci-only-secret-do-not-use-outside-tests"

  godot-validation:
    name: Godot 4.7.2 Import, Gameplay Tests & Native Web Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2 and Web Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate Project Import & Run Headless Tests
        run: ./scripts/test-game.sh

      - name: Validate Native WebAssembly Export
        run: ./scripts/export-web.sh
